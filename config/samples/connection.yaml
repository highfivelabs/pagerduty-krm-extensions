apiVersion: v1
kind: Secret
metadata:
  name: pagerduty-credentials
  namespace: team-a
stringData:
  token: <token>
---
apiVersion: core.pagerduty.hfl.dev/v1alpha1
kind: Connection
metadata:
  name: default
  namespace: team-a
spec:
  baseURL: https://api.pagerduty.com
  secretRef:
    name: pagerduty-credentials
